name: Build

# Windows VST3 (x64) build, plus a macOS compile check. GitHub Actions is
# the build machine for both -- nobody working on this project has a
# Windows box to build or test on, so the Windows job is unverified by a
# human until someone runs the zip it produces.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write   # gh release upload, on a v* tag (windows-vst3 job only)

env:
  JUCE_TAG: 8.0.8

jobs:
  windows-vst3:
    name: Windows VST3 (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone JUCE ${{ env.JUCE_TAG }}
        shell: bash
        run: git clone --depth 1 --branch "${{ env.JUCE_TAG }}" https://github.com/juce-framework/JUCE.git "${{ github.workspace }}/JUCE"

      - name: Read AX_VERSION / AX_BUILD from version.h
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          V=$(sed -n 's/.*#define AX_VERSION "\([^"]*\)".*/\1/p' plugin-chain/src/version.h)
          B=$(sed -n 's/.*#define AX_BUILD \([0-9]*\).*/\1/p' plugin-chain/src/version.h)
          if [ -z "$V" ] || [ -z "$B" ]; then
            echo "Could not parse AX_VERSION/AX_BUILD out of plugin-chain/src/version.h" >&2
            exit 1
          fi
          echo "full=${V}.${B}" >> "$GITHUB_OUTPUT"

      - name: Configure (Visual Studio, x64)
        # No -G: let CMake auto-pick whichever Visual Studio generator
        # matches what's actually on the runner. Naming "Visual Studio 17
        # 2022" explicitly failed ("could not find any instance of Visual
        # Studio") on a windows-latest runner that plainly has SOME VS on
        # it (the default generator without -G works) -- windows-latest
        # tracks whatever VS version GitHub currently ships, which moves
        # out from under a hardcoded generator name.
        run: cmake -S plugin-chain -B build -A x64 -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build AX330G_VST3 (Release)
        run: cmake --build build --config Release --target AX330G_VST3

      - name: Package the .vst3 bundle into a zip
        shell: bash
        run: |
          set -euo pipefail
          NAME="AX330G-${{ steps.ver.outputs.full }}-windows-x64"
          BUNDLE=$(find build -type d -iname "AX330G.vst3" | head -n1)
          if [ -z "$BUNDLE" ]; then
            echo "AX330G.vst3 not found under build/ -- build output layout:" >&2
            find build -maxdepth 5 -iname "*.vst3" >&2 || true
            exit 1
          fi
          mkdir -p "dist/$NAME"
          cp -R "$BUNDLE" "dist/$NAME/"
          cp INSTALL-Windows.txt "dist/$NAME/"
          mkdir -p dist-zip
          ZIP_NAME="${NAME}.zip"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/${NAME}' -DestinationPath 'dist-zip/${ZIP_NAME}' -Force"
          echo "zip_path=dist-zip/${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.zip_name }}
          path: ${{ env.zip_path }}

      - name: Attach zip to the GitHub release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Automated build. See workflow run for details."
          gh release upload "$TAG" "${{ env.zip_path }}" --clobber

  macos-compile-check:
    name: macOS compile check
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone JUCE ${{ env.JUCE_TAG }}
        run: git clone --depth 1 --branch "${{ env.JUCE_TAG }}" https://github.com/juce-framework/JUCE.git "${{ github.workspace }}/JUCE"

      - name: Configure (Xcode)
        # AX_COPY_PLUGIN_AFTER_BUILD=OFF: this is a compile check on a
        # throwaway runner, not Mark's own build -- don't install into
        # ~/Library/Audio/Plug-Ins there. Mark's local build doesn't pass
        # this flag and keeps the plugin-chain/CMakeLists.txt default (ON).
        run: cmake -S plugin-chain -B build -G Xcode -DJUCE_DIR="${{ github.workspace }}/JUCE" -DAX_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build AX330G_AU + AX330G_VST3 (Release, compile check only)
        run: cmake --build build --config Release --target AX330G_AU AX330G_VST3
